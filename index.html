<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spansk Scenarie Træner</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 600px;
            margin: 2rem auto;
            padding: 1.5rem;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            margin: 10px 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary { background-color: #4CAF50; color: white; font-weight: bold; }
        .btn-primary:hover { background-color: #45a049; }
        .btn-secondary { background-color: #e0e0e0; color: #333; }
        .btn-secondary:hover { background-color: #ccc; }
        
        .hint-box {
            display: none;
            background: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid #ffc107;
            margin-top: 15px;
            text-align: left;
        }
        .feedback { margin-top: 20px; font-weight: bold; font-size: 1.2rem; }
        #user-text { font-style: italic; color: #555; margin-top: 10px; min-height: 24px; }
    </style>
</head>
<body>

    <div class="card">
        <h2 style="color: #2c3e50;">Scenarie: På Café i Madrid</h2>
        <p>Du har sat dig ved et bord. Tjeneren kommer over til dig.</p>
        
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

        <div>
            <h3 id="npc-text">"Hola, ¿qué vas a tomar?"</h3>
            <button class="btn-secondary" onclick="speakNPC()">🔊 Lyt til tjeneren</button>
        </div>

        <button class="btn-secondary" onclick="toggleHint()">💡 Vis hint</button>
        
        <div id="hint-box" class="hint-box">
            <p><strong>Gloser:</strong> En kaffe = un café | Vand = agua</p>
            <p><strong>Forslag:</strong> "Quiero un café, por favor." (Jeg vil gerne have en kaffe, tak)</p>
        </div>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

        <div>
            <button class="btn-primary" onclick="startListening()" id="mic-btn">🎤 Tryk og tal</button>
            <p id="user-text"><em>Venter på din tale...</em></p>
        </div>

        <div id="feedback" class="feedback"></div>
    </div>

    <script>
        // Opsætning af scenariet og de ord appen vil godkende
        const scenario = {
            npc_text: "Hola, ¿qué vas a tomar?",
            expected_keywords: ["café", "agua", "cerveza", "vino", "té", "tapas"]
        };

        // Funktion til at læse spansk op
        function speakNPC() {
            const utterance = new SpeechSynthesisUtterance(scenario.npc_text);
            utterance.lang = 'es-ES'; // Spansk fra Spanien
            utterance.rate = 0.9;     // Lidt langsommere for læringens skyld
            window.speechSynthesis.speak(utterance);
        }

        // Funktion til at vise/skjule hints
        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.style.display = hintBox.style.display === 'block' ? 'none' : 'block';
        }

        // Funktion til at lytte til mikrofonen
        function startListening() {
            // Understøttelse for Chrome og Edge (Webkit)
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("Din browser understøtter ikke talegenkendelse. Brug venligst Google Chrome eller Edge.");
                return;
            }
            
            const recognition = new SpeechRecognition();
            recognition.lang = 'es-ES'; // Lytter efter spansk
            recognition.interimResults = false;
            
            const micBtn = document.getElementById('mic-btn');
            const userText = document.getElementById('user-text');
            const feedback = document.getElementById('feedback');
            
            micBtn.innerText = "🔴 Lytter...";
            micBtn.style.backgroundColor = "#f44336"; // Rød mens den lytter
            feedback.innerText = "";
            userText.innerHTML = "<em>Lytter...</em>";
            
            recognition.start();
            
            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript.toLowerCase();
                userText.innerHTML = `Du sagde: <strong>"${transcript}"</strong>`;
                
                // Simpel validering: Tjek om et af de forventede ord er i sætningen
                const passed = scenario.expected_keywords.some(kw => transcript.includes(kw));
                
                if (passed) {
                    feedback.style.color = "#4CAF50";
                    feedback.innerText = "✅ Perfekt! Tjeneren forstod dig.";
                } else {
                    feedback.style.color = "#f44336";
                    feedback.innerText = "❌ Tjeneren fangede det ikke helt. Prøv igen!";
                }
            };
            
            recognition.onspeechend = function() {
                recognition.stop();
                resetMicButton(micBtn);
            };
            
            recognition.onerror = function(event) {
                resetMicButton(micBtn);
                feedback.innerText = "Der opstod en fejl. Sørg for at du har givet tilladelse til mikrofonen.";
            };
        }

        function resetMicButton(btn) {
            btn.innerText = "🎤 Tryk og tal";
            btn.style.backgroundColor = "#4CAF50";
        }
    </script>
</body>
</html>
