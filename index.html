<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spansk Sprogtræner</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-hover: #059669;
            --bg-gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.85);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            height: 100dvh;
        }

        .card {
            background: var(--card-bg);
            border: none;
            outline: none;
            border-radius: 24px;
            padding: 1.75rem 1.5rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 520px; /* Fast højde så alt sidder perfekt */
        }

        /* Top Navigation / Tabs */
        .nav-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 1rem;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .header-tag {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.7rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 0.25rem;
            display: block;
        }

        h2 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 300;
            color: var(--text-muted);
        }

        .npc-dialogue {
            font-size: 1.35rem;
            font-weight: 500;
            margin: 0.75rem 0 0.5rem 0;
            color: var(--text-main);
            line-height: 1.3;
        }

        button {
            font-family: inherit;
            border: none;
            border-radius: 99px;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-listen {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            padding: 8px 16px;
            font-size: 0.8rem;
            margin-bottom: 0.25rem;
        }

        .btn-listen:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            width: 100%;
            margin-top: 0.75rem;
            font-size: 1rem;
            padding: 14px;
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.2);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-primary.listening {
            background: #ef4444;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.5);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .hint-toggle {
            background: transparent;
            color: var(--text-muted);
            font-size: 0.8rem;
            padding: 2px 8px;
            margin-top: 0.25rem;
        }

        .hint-toggle:hover {
            color: var(--text-main);
        }

        .hint-box {
            display: none;
            background: rgba(15, 23, 42, 0.5);
            padding: 0.5rem 0.75rem;
            border-radius: 10px;
            margin-top: 0.25rem;
            text-align: left;
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.3;
        }
        
        .hint-box strong { color: var(--text-main); }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            margin: 0.75rem 0;
        }

        #user-text, #chat-user-text {
            margin-top: 0.5rem;
            min-height: 18px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-style: italic;
        }

        .feedback {
            margin-top: 0.25rem;
            font-weight: 500;
            font-size: 0.95rem;
            min-height: 20px;
        }
        
        .success { color: #10b981; }
        .error { color: #ef4444; }

        .mode-container {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }
        .mode-container.active {
            display: flex;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Top Navigation -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchMode('scenario')" id="tab-scenario">🎯 Scenarier</button>
            <button class="tab-btn" onclick="switchMode('chat')" id="tab-chat">☕ Fri Samtale</button>
        </div>

        <!-- MODE 1: SCENARIER -->
        <div id="mode-scenario" class="mode-container active">
            <div>
                <span class="header-tag" id="scenario-tag">Scenarie 1 af 3</span>
                <h2 id="scenario-title">På Café i Madrid</h2>
            </div>
            
            <div class="divider"></div>

            <div>
                <div class="npc-dialogue" id="npc-text">"Hola, ¿qué vas a tomar?"</div>
                <button class="btn-listen" onclick="speakText(scenarios[currentIndex].npc_text)">🔊 Lyt til tjeneren</button>
                <div>
                    <button class="hint-toggle" onclick="toggleHint()">💡 Brug for et hint?</button>
                    <div id="hint-box" class="hint-box"></div>
                </div>
            </div>

            <div class="divider"></div>

            <div>
                <button class="btn-primary" onclick="startScenarioListening()" id="mic-btn-scenario">🎤 Tryk for at svare</button>
                <p id="user-text">Din tur til at tale...</p>
                <div id="feedback" class="feedback"></div>
            </div>
        </div>

        <!-- MODE 2: FRI SAMTALE (CAFÉ-SNAK) -->
        <div id="mode-chat" class="mode-container">
            <div>
                <span class="header-tag">Café-snak</span>
                <h2>Fri Spansk Dialog</h2>
            </div>
            
            <div class="divider"></div>

            <div>
                <div class="npc-dialogue" id="chat-npc-text">"¡Hola! ¿Qué tal tu día? Cuéntame algo."</div>
                <button class="btn-listen" onclick="speakText(currentChatPrompt)">🔊 Lyt til AI</button>
                <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 5px;">Svar frit på spansk om hvad som helst!</p>
            </div>

            <div class="divider"></div>

            <div>
                <button class="btn-primary" onclick="startChatListening()" id="mic-btn-chat">🎤 Tal med AI</button>
                <p id="chat-user-text">Lytter efter din stemme...</p>
                <div id="chat-feedback" class="feedback success"></div>
            </div>
        </div>
    </div>

    <script>
        // --- LOGIK FOR SCENARIER ---
        const scenarios = [
            {
                tag: "Scenarie 1 af 3",
                title: "På Café i Madrid",
                npc_text: "Hola, ¿qué vas a tomar?",
                hints_gloser: "En kaffe = un café | Vand = agua",
                hints_sagt: "Quiero un café, por favor.",
                expected_keywords: ["café", "agua", "cerveza", "vino", "té", "tapas"]
            },
            {
                tag: "Scenarie 2 af 3",
                title: "I Lufthavnen",
                npc_text: "¿Cuál es el propósito de su viaje?",
                hints_gloser: "Ferie = vacaciones | Turisme = turismo",
                hints_sagt: "Voy de vacaciones.",
                expected_keywords: ["vacaciones", "turismo", "trabajo", "negocios"]
            },
            {
                tag: "Scenarie 3 af 3",
                title: "I Tøjbutikken",
                npc_text: "¿Le puedo ayudar en algo?",
                hints_gloser: "Skjorte = camisa | Bukser = pantalones",
                hints_sagt: "Busco una camisa.",
                expected_keywords: ["camisa", "pantalones", "chaqueta", "ayuda", "busco"]
            }
        ];

        let currentIndex = 0;

        function loadScenario() {
            const s = scenarios[currentIndex];
            document.getElementById('scenario-tag').innerText = s.tag;
            document.getElementById('scenario-title').innerText = s.title;
            document.getElementById('npc-text').innerText = `"${s.npc_text}"`;
            document.getElementById('hint-box').innerHTML = `
                <p><strong>Gloser:</strong> ${s.hints_gloser}</p>
                <p><strong>Forslag:</strong> "${s.hints_sagt}"</p>
            `;
            document.getElementById('hint-box').style.display = 'none';
            document.getElementById('user-text').innerText = "Din tur til at tale...";
            document.getElementById('feedback').innerText = "";
        }

        // --- LOGIK FOR FRI SAMTALE ---
        let currentChatPrompt = "¡Hola! ¿Qué tal tu día? Cuéntame algo.";
        const chatResponses = [
            "¡Qué interesante! Cuéntame más sobre eso.",
            "Entiendo perfectamente. ¿Y qué planes tienes for el fin de semana?",
            "¡Muy bien! Oye, ¿cuál es tu comida favorita?",
            "¡Quéကောင်း! (Qué bien!) ¿Te gustaviajar?",
            "Interesante perspectiva. ¿Desde cuándo aprendes español?"
        ];

        function speakText(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES'; 
            utterance.rate = 0.9;     
            window.speechSynthesis.speak(utterance);
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.style.display = hintBox.style.display === 'block' ? 'none' : 'block';
        }

        function switchMode(mode) {
            document.getElementById('mode-scenario').classList.remove('active');
            document.getElementById('mode-chat').classList.remove('active');
            document.getElementById('tab-scenario').classList.remove('active');
            document.getElementById('tab-chat').classList.remove('active');

            if (mode === 'scenario') {
                document.getElementById('mode-scenario').classList.add('active');
                document.getElementById('tab-scenario').classList.add('active');
            } else {
                document.getElementById('mode-chat').classList.add('active');
                document.getElementById('tab-chat').classList.add('active');
            }
        }

        // Scenarie Genkendelse
        function startScenarioListening() {
            runSpeechRecognition('es-ES', (transcript) => {
                document.getElementById('user-text').innerHTML = `Du sagde: "${transcript}"`;
                const s = scenarios[currentIndex];
                const passed = s.expected_keywords.some(kw => transcript.includes(kw));
                const feedback = document.getElementById('feedback');
                
                if (passed) {
                    feedback.innerText = "✅ Perfekt! Går til næste...";
                    feedback.className = "feedback success";
                    setTimeout(() => {
                        currentIndex++;
                        if (currentIndex < scenarios.length) {
                            loadScenario();
                        } else {
                            currentIndex = 0;
                            loadScenario();
                        }
                    }, 1500);
                } else {
                    feedback.innerText = "❌ Prøv igen! Fangede det ikke.";
                    feedback.className = "feedback error";
                }
            }, document.getElementById('mic-btn-scenario'));
        }

        // Fri Samtale Genkendelse
        function startChatListening() {
            runSpeechRecognition('es-ES', (transcript) => {
                document.getElementById('chat-user-text').innerHTML = `Du sagde: "${transcript}"`;
                
                // Vælg et tilfældigt opfølgende svar fra AI'en
                const randomReply = chatResponses[Math.floor(Math.random() * chatResponses.length)];
                currentChatPrompt = randomReply;
                
                document.getElementById('chat-npc-text').innerText = `"${randomReply}"`;
                document.getElementById('chat-feedback').innerText = "👍 Godt sagt! Lyt til AI'ens svar ovenfor.";
                
                // Lyt automatisk AI'ens svar op
                speakText(randomReply);
            }, document.getElementById('mic-btn-chat'));
        }

        // Fælles tale-til-tekst motor
        function runSpeechRecognition(lang, onSuccess, btnElement) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Din browser understøtter ikke talegenkendelse. Brug Chrome eller Edge.");
                return;
            }
            
            const recognition = new SpeechRecognition();
            recognition.lang = lang;
            recognition.interimResults = false;
            
            btnElement.innerHTML = "🎙️ Lytter...";
            btnElement.classList.add('listening');
            
            recognition.start();
            
            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript.toLowerCase();
                onSuccess(transcript);
            };
            
            recognition.onspeechend = function() {
                recognition.stop();
                resetBtn(btnElement);
            };
            
            recognition.onerror = function() {
                resetBtn(btnElement);
            };
        }

        function resetBtn(btn) {
            btn.innerHTML = "🎤 Tryk for at svare";
            btn.classList.remove('listening');
        }

        // Initialiser første scenarie ved load
        loadScenario();
    </script>
</body>
</html>
