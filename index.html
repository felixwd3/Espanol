<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spansk Sprogtræner</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-hover: #059669;
            --bg-gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.85);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            height: 100dvh;
        }

        .card {
            background: var(--card-bg);
            border: none;
            outline: none;
            border-radius: 24px;
            padding: 1.25rem 1.5rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 610px; /* Fast højde så intet scroller */
        }

        /* Top Navigation / 3 Faner */
        .nav-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 3px;
            margin-bottom: 0.5rem;
            gap: 2px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 4px;
            font-size: 0.75rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        /* Vælger-knapper */
        .selector-row {
            display: flex;
            gap: 5px;
            margin-bottom: 0.4rem;
        }

        .select-pill {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 5px 2px;
            font-size: 0.7rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .select-pill.active {
            background: rgba(16, 185, 129, 0.2);
            border-color: var(--primary);
            color: var(--text-main);
            font-weight: 600;
        }

        .header-tag {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.65rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 0.15rem;
            display: block;
        }

        h2 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 300;
            color: var(--text-muted);
        }

        .npc-dialogue {
            font-size: 1.15rem;
            font-weight: 500;
            margin: 0.3rem 0;
            color: var(--text-main);
            line-height: 1.25;
            min-height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button {
            font-family: inherit;
            border: none;
            border-radius: 99px;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-listen {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            padding: 6px 14px;
            font-size: 0.75rem;
            margin-bottom: 0.1rem;
        }

        .btn-listen:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            width: 100%;
            margin-top: 0.4rem;
            font-size: 0.95rem;
            padding: 12px;
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.2);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-primary.listening {
            background: #ef4444;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.5);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .hint-toggle {
            background: transparent;
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 2px 8px;
            margin-top: 0.1rem;
        }
        
        .hint-toggle:hover {
            color: var(--text-main);
        }

        .hint-box {
            display: none;
            background: rgba(15, 23, 42, 0.6);
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            margin-top: 0.2rem;
            text-align: left;
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.3;
        }
        
        .hint-box strong { color: var(--text-main); }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            margin: 0.4rem 0;
        }

        #user-text, #sit-user-text, #chat-user-text {
            margin-top: 0.3rem;
            min-height: 16px;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-style: italic;
        }

        .feedback {
            margin-top: 0.2rem;
            font-weight: 500;
            font-size: 0.85rem;
            min-height: 18px;
        }
        
        .success { color: #10b981; }
        .error { color: #ef4444; }

        .mode-container {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }
        .mode-container.active {
            display: flex;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Top Navigation -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchMode('scenario')" id="tab-scenario">🎯 Scenarier</button>
            <button class="tab-btn" onclick="switchMode('situation')" id="tab-situation">🛒 Situationer</button>
            <button class="tab-btn" onclick="switchMode('chat')" id="tab-chat">☕ Fri Samtale</button>
        </div>

        <!-- MODE 1: SCENARIER -->
        <div id="mode-scenario" class="mode-container active">
            <div>
                <span class="header-tag" id="scenario-tag">Scenarie 1 af 3</span>
                <h2 id="scenario-title">På Café i Madrid</h2>
            </div>
            
            <div class="divider"></div>

            <div>
                <div class="npc-dialogue" id="npc-text">"Hola, ¿qué vas a tomar?"</div>
                <button class="btn-listen" onclick="speakText(scenarios[currentIndex].npc_text, 0.9)">🔊 Lyt til tjeneren</button>
                <div>
                    <button class="hint-toggle" onclick="toggleHint('scenario')">💡 Brug for et hint?</button>
                    <div id="hint-box-scenario" class="hint-box"></div>
                </div>
            </div>

            <div class="divider"></div>

            <div>
                <button class="btn-primary" onclick="startScenarioListening()" id="mic-btn-scenario">🎤 Tryk for at svare</button>
                <p id="user-text">Din tur til at tale...</p>
                <div id="feedback" class="feedback"></div>
            </div>
        </div>

        <!-- MODE 2: SITUATIONER (ROLLESPIL MED HINT-KNAP) -->
        <div id="mode-situation" class="mode-container">
            <div>
                <span class="header-tag">Interaktivt Rollespil</span>
                <div class="selector-row">
                    <button class="select-pill active" onclick="setSituation('cafe')" id="sit-cafe">☕ Café</button>
                    <button class="select-pill" onclick="setSituation('supermarket')" id="sit-supermarket">🛒 Supermarked</button>
                    <button class="select-pill" onclick="setSituation('clothing')" id="sit-clothing">👕 Tøjbutik</button>
                </div>
            </div>
            
            <div class="divider" style="margin: 0.1rem 0;"></div>

            <div>
                <div class="npc-dialogue" id="sit-npc-text">"¡Hola! Bienvenidos..."</div>
                <button class="btn-listen" onclick="speakSituationPrompt()">🔊 Lyt til personen</button>
                <div>
                    <button class="hint-toggle" onclick="toggleHint('situation')">💡 Hjælp til denne situation?</button>
                    <div id="hint-box-situation" class="hint-box"></div>
                </div>
            </div>

            <div class="divider" style="margin: 0.1rem 0;"></div>

            <div>
                <button class="btn-primary" onclick="startSituationListening()" id="mic-btn-situation">🎤 Svar i samtalen</button>
                <p id="sit-user-text">Før dialogen videre...</p>
                <div id="sit-feedback" class="feedback success"></div>
            </div>
        </div>

        <!-- MODE 3: FRI SAMTALE -->
        <div id="mode-chat" class="mode-container">
            <div>
                <span class="header-tag">Café-snak</span>
                <h2>Vælg niveau:</h2>
                <div class="selector-row">
                    <button class="select-pill active" onclick="setDifficulty('beginner')" id="diff-beginner">🌱 Begynder</button>
                    <button class="select-pill" onclick="setDifficulty('intermediate')" id="diff-intermediate">🌿 Øvet</button>
                    <button class="select-pill" onclick="setDifficulty('advanced')" id="diff-advanced">🌳 Avanceret</button>
                </div>
            </div>
            
            <div class="divider" style="margin: 0.2rem 0;"></div>

            <div>
                <div class="npc-dialogue" id="chat-npc-text">"¡Hola! ¿Cómo te llamas?"</div>
                <button class="btn-listen" onclick="speakChatPrompt()">🔊 Lyt til AI</button>
            </div>

            <div class="divider" style="margin: 0.2rem 0;"></div>

            <div>
                <button class="btn-primary" onclick="startChatListening()" id="mic-btn-chat">🎤 Tal med AI</button>
                <p id="chat-user-text">Svar på spansk...</p>
                <div id="chat-feedback" class="feedback success"></div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. SCENARIE LOGIK ---
        const scenarios = [
            {
                tag: "Scenarie 1 af 3",
                title: "På Café i Madrid",
                npc_text: "Hola, ¿qué vas a tomar?",
                hints_gloser: "En kaffe = un café | Vand = agua",
                hints_sagt: "Quiero un café, por favor.",
                expected_keywords: ["café", "agua", "cerveza", "vino", "té", "tapas"]
            },
            {
                tag: "Scenarie 2 af 3",
                title: "I Lufthavnen",
                npc_text: "¿Cuál es el propósito de su viaje?",
                hints_gloser: "Ferie = vacaciones | Turisme = turismo",
                hints_sagt: "Voy de vacaciones.",
                expected_keywords: ["vacaciones", "turismo", "trabajo", "negocios"]
            },
            {
                tag: "Scenarie 3 af 3",
                title: "I Tøjbutikken",
                npc_text: "¿Le puedo ayudar en algo?",
                hints_gloser: "Skjorte = camisa | Bukser = pantalones",
                hints_sagt: "Busco una camisa.",
                expected_keywords: ["camisa", "pantalones", "chaqueta", "ayuda", "busco"]
            }
        ];

        let currentIndex = 0;

        function loadScenario() {
            const s = scenarios[currentIndex];
            document.getElementById('scenario-tag').innerText = s.tag;
            document.getElementById('scenario-title').innerText = s.title;
            document.getElementById('npc-text').innerText = `"${s.npc_text}"`;
            document.getElementById('hint-box-scenario').innerHTML = `
                <p><strong>Gloser:</strong> ${s.hints_gloser}</p>
                <p><strong>Forslag:</strong> "${s.hints_sagt}"</p>
            `;
            document.getElementById('hint-box-scenario').style.display = 'none';
            document.getElementById('user-text').innerText = "Din tur til at tale...";
            document.getElementById('feedback').innerText = "";
        }

        // --- 2. SITUATIONER / ROLLESPIL MED HINTS ---
        let currentSituation = 'cafe';
        const situationData = {
            cafe: [
                {
                    npc: "¡Hola! Bienvenidos. ¿Tienen reserva eller prefieren mesa?",
                    gloser: "Vi har ikke = no tenemos | Bord = mesa",
                    forslag: "No tenemos reserva, preferimos una mesa para dos."
                },
                {
                    npc: "Muy bien, aquí tienen la mesa. ¿Qué les gustaría tomar?",
                    gloser: "En kaffe = un café | Vand = agua",
                    forslag: "Para mí un café con leche y una botella de agua, por favor."
                },
                {
                    npc: "Perfecto. ¿Desean algo de comer, por ejemplo unas tapas?",
                    gloser: "Ja tak = sí, por favor | Tapas = tapas",
                    forslag: "Sí, nos gustaría probar unas tapas de jamón."
                },
                {
                    npc: "Enseguida se lo traigo. ¿Algo más?",
                    gloser: "Nej tak = no, gracias | Regning = la cuenta",
                    forslag: "De momento es todo, muchas gracias."
                }
            ],
            supermarket: [
                {
                    npc: "¡Hola! ¿Busca algo en especial?",
                    gloser: "Jeg leder efter = busco | Mælk = leche",
                    forslag: "Sí, busco dónde están los lácteos y la leche."
                },
                {
                    npc: "Los lácteos están en el pasillo tres, al fondo.",
                    gloser: "Mange tak = muchas gracias",
                    forslag: "Ah, muchas gracias por su ayuda."
                },
                {
                    npc: "¿Encontró todo? Pase por la caja dos, por favor.",
                    gloser: "Ja = sí | Kasse = caja",
                    forslag: "Sí, ya voy hacia la caja."
                },
                {
                    npc: "Serían doce euros. ¿Paga con tarjeta eller efectivo?",
                    gloser: "Med kort = con tarjeta | Kontant = en efectivo",
                    forslag: "Pago con tarjeta, por favor. Aquí tiene."
                }
            ],
            clothing: [
                {
                    npc: "¡Buenos días! ¿Le puedo ayudar en algo?",
                    gloser: "Jeg leder efter = busco | Skjorte = camisa",
                    forslag: "Sí, busco una camisa elegante para hombre."
                },
                {
                    npc: "Claro, esta en azul es popular. ¿Quiere probársela?",
                    gloser: "Prøverum = probador | Ja tak = sí, por favor",
                    forslag: "Sí, me gustaría probármela. ¿Dónde están los probadores?"
                },
                {
                    npc: "Están al fondo a la derecha. ¿Qué tal le queda?",
                    gloser: "Den sidder godt = me queda bien | For lille = muy pequeña",
                    forslag: "Me queda perfecta, me la llevo."
                },
                {
                    npc: "Excelente. ¿Va a ser todo por hoy?",
                    gloser: "Ja, tak = sí, gracias",
                    forslag: "Sí, eso es todo. ¿Cuánto es?"
                }
            ]
        };

        let currentSitStep = 0;

        function setSituation(sit) {
            currentSituation = sit;
            currentSitStep = 0;
            
            document.getElementById('sit-cafe').classList.remove('active');
            document.getElementById('sit-supermarket').classList.remove('active');
            document.getElementById('sit-clothing').classList.remove('active');
            document.getElementById(`sit-${sit}`).classList.add('active');

            updateSituationPrompt();
        }

        function updateSituationPrompt() {
            const stepObj = situationData[currentSituation][currentSitStep];
            document.getElementById('sit-npc-text').innerText = `"${stepObj.npc}"`;
            document.getElementById('hint-box-situation').innerHTML = `
                <p><strong>Gloser:</strong> ${stepObj.gloser}</p>
                <p><strong>Forslag:</strong> "${stepObj.forslag}"</p>
            `;
            document.getElementById('hint-box-situation').style.display = 'none';
            document.getElementById('sit-user-text').innerText = "Før dialogen videre...";
            document.getElementById('sit-feedback').innerText = "";
            speakSituationPrompt();
        }

        function speakSituationPrompt() {
            const stepObj = situationData[currentSituation][currentSitStep];
            speakText(stepObj.npc, 0.85);
        }

        // --- 3. FRI SAMTALE LOGIK ---
        let currentDifficulty = 'beginner';
        const chatData = {
            beginner: {
                speed: 0.75,
                prompts: ["¡Hola! ¿Cómo te llamas?", "¿De dónde eres?", "¿Qué te gusta comer?", "¿Tienes hermanos o mascotas?"]
            },
            intermediate: {
                speed: 0.9,
                prompts: ["¿Qué planes tienes för el fin de semana?", "¿Cuál es tu lugar favorito para viajar?", "¿Qué tipo de música escuchas?", "Cuéntame sobre tu trabajo."]
            },
            advanced: {
                speed: 1.0,
                prompts: ["Si pudieras vivir en cualquier país, ¿cuál elegirías?", "¿Crees que la tecnología mejora nuestra vida?", "¿Cuál ha sido tu mayor desafío?", "¿Qué opinas de aprender idiomas?"]
            }
        };

        let currentChatIndex = 0;

        function setDifficulty(level) {
            currentDifficulty = level;
            currentChatIndex = 0;
            document.getElementById('diff-beginner').classList.remove('active');
            document.getElementById('diff-intermediate').classList.remove('active');
            document.getElementById('diff-advanced').classList.remove('active');
            document.getElementById(`diff-${level}`).classList.add('active');
            updateChatPrompt();
        }

        function updateChatPrompt() {
            const prompt = chatData[currentDifficulty].prompts[currentChatIndex];
            document.getElementById('chat-npc-text').innerText = `"${prompt}"`;
            speakChatPrompt();
        }

        function speakChatPrompt() {
            const prompt = document.getElementById('chat-npc-text').innerText.replace(/"/g, '');
            speakText(prompt, chatData[currentDifficulty].speed);
        }

        function speakText(text, speed) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES'; 
            utterance.rate = speed || 0.9;     
            window.speechSynthesis.speak(utterance);
        }

        function toggleHint(mode) {
            const hintBox = document.getElementById(`hint-box-${mode}`);
            hintBox.style.display = hintBox.style.display === 'block' ? 'none' : 'block';
        }

        function switchMode(mode) {
            document.getElementById('mode-scenario').classList.remove('active');
            document.getElementById('mode-situation').classList.remove('active');
            document.getElementById('mode-chat').classList.remove('active');
            document.getElementById('tab-scenario').classList.remove('active');
            document.getElementById('tab-situation').classList.remove('active');
            document.getElementById('tab-chat').classList.remove('active');

            if (mode === 'scenario') {
                document.getElementById('mode-scenario').classList.add('active');
                document.getElementById('tab-scenario').classList.add('active');
            } else if (mode === 'situation') {
                document.getElementById('mode-situation').classList.add('active');
                document.getElementById('tab-situation').classList.add('active');
            } else {
                document.getElementById('mode-chat').classList.add('active');
                document.getElementById('tab-chat').classList.add('active');
            }
        }

        // Scenarie Genkendelse
        function startScenarioListening() {
            runSpeechRecognition('es-ES', (transcript) => {
                document.getElementById('user-text').innerHTML = `Du sagde: "${transcript}"`;
                const s = scenarios[currentIndex];
                const passed = s.expected_keywords.some(kw => transcript.includes(kw));
                const feedback = document.getElementById('feedback');
                
                if (passed) {
                    feedback.innerText = "✅ Perfekt! Går til næste...";
                    feedback.className = "feedback success";
                    setTimeout(() => {
                        currentIndex++;
                        if (currentIndex < scenarios.length) {
                            loadScenario();
                        } else {
                            currentIndex = 0;
                            loadScenario();
                        }
                    }, 1500);
                } else {
                    feedback.innerText = "❌ Prøv igen! Fangede det ikke.";
                    feedback.className = "feedback error";
                }
            }, document.getElementById('mic-btn-scenario'));
        }

        // Situationer / Rollespil Genkendelse med flydende dialog
        function startSituationListening() {
            runSpeechRecognition('es-ES', (transcript) => {
                document.getElementById('sit-user-text').innerHTML = `Du sagde: "${transcript}"`;
                
                const steps = situationData[currentSituation];
                currentSitStep++;
                
                const feedback = document.getElementById('sit-feedback');
                feedback.innerText = "👍 Godt svar! Fortsætter samtalen...";
                feedback.className = "feedback success";

                setTimeout(() => {
                    if (currentSitStep < steps.length) {
                        updateSituationPrompt();
                    } else {
                        // Gennemført! Start forfra eller vis succes
                        document.getElementById('sit-npc-text').innerText = `"¡Excelente conversación! Has completado la situación con éxito. 🎉"`;
                        speakText("¡Excelente conversación! Has completado la situación con éxito.", 0.9);
                        document.getElementById('sit-user-text').innerText = "Rollefuldført!";
                        feedback.innerText = "✨ Tryk på en situation for at starte igen.";
                        currentSitStep = 0;
                    }
                }, 1200);

            }, document.getElementById('mic-btn-situation'));
        }

        // Fri Samtale Genkendelse
        function startChatListening() {
            runSpeechRecognition('es-ES', (transcript) => {
                document.getElementById('chat-user-text').innerHTML = `Du sagde: "${transcript}"`;
                
                const data = chatData[currentDifficulty];
                currentChatIndex = (currentChatIndex + 1) % data.prompts.length;
                const nextPrompt = data.prompts[currentChatIndex];
                
                const fullResponse = `¡Entendido! ${nextPrompt}`;
                document.getElementById('chat-npc-text').innerText = `"${fullResponse}"`;
                document.getElementById('chat-feedback').innerText = "👍 Godt sagt! Lyt til næste spørgsmål.";
                
                speakText(fullResponse, data.speed);
            }, document.getElementById('mic-btn-chat'));
        }

        // Fælles tale-til-tekst motor
        function runSpeechRecognition(lang, onSuccess, btnElement) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Din browser understøtter ikke talegenkendelse. Brug Chrome eller Edge.");
                return;
            }
            
            const recognition = new SpeechRecognition();
            recognition.lang = lang;
            recognition.interimResults = false;
            
            btnElement.innerHTML = "🎙️ Lytter...";
            btnElement.classList.add('listening');
            
            recognition.start();
            
            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript.toLowerCase();
                onSuccess(transcript);
            };
            
            recognition.onspeechend = function() {
                recognition.stop();
                resetBtn(btnElement);
            };
            
            recognition.onerror = function() {
                resetBtn(btnElement);
            };
        }

        function resetBtn(btn) {
            btn.innerHTML = "🎤 Tryk for at svare";
            btn.classList.remove('listening');
        }

        // Start op
        loadScenario();
        setSituation('cafe');
        setDifficulty('beginner');
    </script>
</body>
</html>
