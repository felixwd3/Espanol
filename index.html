<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spansk Scenarie Træner</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-hover: #059669;
            --bg-gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.85);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            height: 100dvh;
        }

        .card {
            background: var(--card-bg);
            border: none;
            outline: none;
            border-radius: 24px;
            padding: 2rem 1.5rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header-tag {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.7rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 0.25rem;
            display: block;
        }

        h2 {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 300;
            color: var(--text-muted);
        }

        .npc-dialogue {
            font-size: 1.5rem;
            font-weight: 500;
            margin: 1rem 0 0.5rem 0;
            color: var(--text-main);
            line-height: 1.2;
        }

        button {
            font-family: inherit;
            border: none;
            border-radius: 99px;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-listen {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            padding: 10px 20px;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }

        .btn-listen:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            width: 100%;
            margin-top: 1rem;
            font-size: 1rem;
            padding: 14px;
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.2);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-primary.listening {
            background: #ef4444;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.5);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .hint-toggle {
            background: transparent;
            color: var(--text-muted);
            font-size: 0.8rem;
            padding: 4px 12px;
            margin-top: 0.25rem;
        }

        .hint-toggle:hover {
            color: var(--text-main);
        }

        .hint-box {
            display: none;
            background: rgba(15, 23, 42, 0.5);
            padding: 0.75rem 1rem;
            border-radius: 12px;
            margin-top: 0.5rem;
            text-align: left;
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }
        
        .hint-box strong { color: var(--text-main); }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            margin: 1rem 0;
        }

        #user-text {
            margin-top: 0.75rem;
            min-height: 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-style: italic;
        }

        .feedback {
            margin-top: 0.5rem;
            font-weight: 500;
            font-size: 1rem;
            min-height: 20px;
        }
        
        .success { color: #10b981; }
        .error { color: #ef4444; }

    </style>
</head>
<body>

    <div class="card">
        <div>
            <span class="header-tag" id="scenario-tag">Scenarie 1 af 3</span>
            <h2 id="scenario-title">På Café i Madrid</h2>
        </div>
        
        <div class="divider"></div>

        <div>
            <div class="npc-dialogue" id="npc-text">
                "Hola, ¿qué vas a tomar?"
            </div>
            <button class="btn-listen" onclick="speakNPC()">🔊 Lyt til tjeneren</button>

            <div>
                <button class="hint-toggle" onclick="toggleHint()">💡 Brug for et hint?</button>
                <div id="hint-box" class="hint-box" id="hint-content">
                    <p><strong>Gloser:</strong> En kaffe = un café | Vand = agua</p>
                    <p><strong>Forslag:</strong> "Quiero un café, por favor."</p>
                </div>
            </div>
        </div>

        <div class="divider"></div>

        <div>
            <button class="btn-primary" onclick="startListening()" id="mic-btn">🎤 Tryk for at svare</button>
            <p id="user-text">Din tur til at tale...</p>
            <div id="feedback" class="feedback"></div>
        </div>
    </div>

    <script>
        // Liste over scenarier
        const scenarios = [
            {
                tag: "Scenarie 1 af 3",
                title: "På Café i Madrid",
                npc_text: "Hola, ¿qué vas a tomar?",
                hints_gloser: "En kaffe = un café | Vand = agua",
                hints_sagt: "Quiero un café, por favor.",
                expected_keywords: ["café", "agua", "cerveza", "vino", "té", "tapas"]
            },
            {
                tag: "Scenarie 2 af 3",
                title: "I Lufthavnen",
                npc_text: "¿Cuál es el propósito de su viaje?",
                hints_gloser: "Ferie = vacaciones | Turisme = turismo",
                hints_sagt: "Voy de vacaciones.",
                expected_keywords: ["vacaciones", "turismo", "trabajo", "negocios"]
            },
            {
                tag: "Scenarie 3 af 3",
                title: "I Tøjbutikken",
                npc_text: "¿Le puedo ayudar en algo?",
                hints_gloser: "Skjorte = camisa | Bukser = pantalones",
                hints_sagt: "Busco una camisa.",
                expected_keywords: ["camisa", "pantalones", "chaqueta", "ayuda", "busco"]
            }
        ];

        let currentIndex = 0;

        function loadScenario() {
            const s = scenarios[currentIndex];
            document.getElementById('scenario-tag').innerText = s.tag;
            document.getElementById('scenario-title').innerText = s.title;
            document.getElementById('npc-text').innerText = `"${s.npc_text}"`;
            
            document.getElementById('hint-box').innerHTML = `
                <p><strong>Gloser:</strong> ${s.hints_gloser}</p>
                <p><strong>Forslag:</strong> "${s.hints_sagt}"</p>
            `;
            document.getElementById('hint-box').style.display = 'none';
            document.getElementById('user-text').innerText = "Din tur til at tale...";
            document.getElementById('feedback').innerText = "";
            document.getElementById('feedback').className = "feedback";
        }

        function speakNPC() {
            const s = scenarios[currentIndex];
            const utterance = new SpeechSynthesisUtterance(s.npc_text);
            utterance.lang = 'es-ES'; 
            utterance.rate = 0.9;     
            window.speechSynthesis.speak(utterance);
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.style.display = hintBox.style.display === 'block' ? 'none' : 'block';
        }

        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("Din browser understøtter ikke talegenkendelse. Brug Chrome eller Edge.");
                return;
            }
            
            const recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.interimResults = false;
            
            const micBtn = document.getElementById('mic-btn');
            const userText = document.getElementById('user-text');
            const feedback = document.getElementById('feedback');
            
            micBtn.innerHTML = "🎙️ Lytter...";
            micBtn.classList.add('listening');
            
            feedback.innerText = "";
            feedback.className = "feedback";
            userText.innerHTML = "Venter på din tale...";
            
            recognition.start();
            
            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript.toLowerCase();
                userText.innerHTML = `Du sagde: "${transcript}"`;
                
                const s = scenarios[currentIndex];
                const passed = s.expected_keywords.some(kw => transcript.includes(kw));
                
                if (passed) {
                    feedback.innerText = "✅ Perfekt! Går til næste scenarie...";
                    feedback.classList.add('success');
                    
                    // Gå til næste scenarie efter 1.5 sekund
                    setTimeout(() => {
                        currentIndex++;
                        if (currentIndex < scenarios.length) {
                            loadScenario();
                        } else {
                            document.querySelector('.card').innerHTML = `
                                <div>
                                    <span class="header-tag">Færdig! 🎉</span>
                                    <h2 style="margin-top: 1rem;">Godt gået!</h2>
                                </div>
                                <div class="npc-dialogue" style="font-size: 1.2rem; margin: 2rem 0;">
                                    Du har gennemført alle scenarier og trænet dine spanske færdigheder.
                                </div>
                                <button class="btn-primary" onclick="currentIndex=0; loadScenario();">Start forfra</button>
                            `;
                        }
                    }, 1800);

                } else {
                    feedback.innerText = "❌ Prøv igen! Fangede det ikke helt.";
                    feedback.classList.add('error');
                }
            };
            
            recognition.onspeechend = function() {
                recognition.stop();
                resetMicButton(micBtn);
            };
            
            recognition.onerror = function(event) {
                resetMicButton(micBtn);
                feedback.innerText = "Sørg for at du har givet tilladelse til mikrofonen.";
                feedback.classList.add('error');
            };
        }

        function resetMicButton(btn) {
            btn.innerHTML = "🎤 Tryk for at svare";
            btn.classList.remove('listening');
        }
    </script>
</body>
</html>
