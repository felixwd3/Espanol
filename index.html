<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spansk Scenarie Træner</title>
    <style>
        /* Premium farvepalet og design-variabler */
        :root {
            --primary: #10b981; /* Lækker smaragdgrøn */
            --primary-hover: #059669;
            --bg-gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* Glassmorphism kort */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 3rem 2rem;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .header-tag {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.75rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: block;
        }

        h2 {
            margin: 0 0 1.5rem 0;
            font-size: 1.5rem;
            font-weight: 300;
            color: var(--text-muted);
        }

        .npc-dialogue {
            font-size: 1.75rem;
            font-weight: 500;
            margin: 2rem 0;
            color: var(--text-main);
            line-height: 1.3;
        }

        /* Moderne knapper uden standardkanter */
        button {
            font-family: inherit;
            border: none;
            border-radius: 99px;
            padding: 16px 28px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-listen {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 12px 24px;
            font-size: 0.9rem;
        }

        .btn-listen:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            width: 100%;
            margin-top: 1.5rem;
            font-size: 1.1rem;
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.2);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.4);
        }

        /* Animation når mikrofonen lytter */
        .btn-primary.listening {
            background: #ef4444;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.5);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .hint-toggle {
            background: transparent;
            color: var(--text-muted);
            font-size: 0.875rem;
            padding: 8px 16px;
            margin-top: 1rem;
        }

        .hint-toggle:hover {
            color: var(--text-main);
        }

        .hint-box {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1.25rem;
            border-radius: 16px;
            margin-top: 1rem;
            text-align: left;
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
        }
        
        .hint-box strong { color: var(--text-main); }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--card-border), transparent);
            margin: 2rem 0;
        }

        #user-text {
            margin-top: 1.5rem;
            min-height: 24px;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-style: italic;
        }

        .feedback {
            margin-top: 1rem;
            font-weight: 500;
            font-size: 1.1rem;
            min-height: 24px;
            transition: color 0.3s;
        }
        
        .success { color: #10b981; }
        .error { color: #ef4444; }

    </style>
</head>
<body>

    <div class="card">
        <span class="header-tag">Scenarie 1</span>
        <h2>På Café i Madrid</h2>
        
        <div class="divider"></div>

        <div class="npc-dialogue" id="npc-text">
            "Hola, ¿qué vas a tomar?"
        </div>
        <button class="btn-listen" onclick="speakNPC()">🔊 Lyt til tjeneren</button>

        <br>
        <button class="hint-toggle" onclick="toggleHint()">💡 Brug for et hint?</button>
        
        <div id="hint-box" class="hint-box">
            <p><strong>Gloser:</strong> En kaffe = un café | Vand = agua</p>
            <p><strong>Forslag:</strong> "Quiero un café, por favor."</p>
        </div>

        <div class="divider"></div>

        <div>
            <button class="btn-primary" onclick="startListening()" id="mic-btn">🎤 Tryk for at svare</button>
            <p id="user-text">Din tur til at tale...</p>
        </div>

        <div id="feedback" class="feedback"></div>
    </div>

    <script>
        const scenario = {
            npc_text: "Hola, ¿qué vas a tomar?",
            expected_keywords: ["café", "agua", "cerveza", "vino", "té", "tapas"]
        };

        function speakNPC() {
            const utterance = new SpeechSynthesisUtterance(scenario.npc_text);
            utterance.lang = 'es-ES'; 
            utterance.rate = 0.9;     
            window.speechSynthesis.speak(utterance);
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.style.display = hintBox.style.display === 'block' ? 'none' : 'block';
        }

        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("Din browser understøtter ikke talegenkendelse. Brug Chrome eller Edge.");
                return;
            }
            
            const recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.interimResults = false;
            
            const micBtn = document.getElementById('mic-btn');
            const userText = document.getElementById('user-text');
            const feedback = document.getElementById('feedback');
            
            // Premium lytte-tilstand
            micBtn.innerHTML = "🎙️ Lytter...";
            micBtn.classList.add('listening');
            
            feedback.innerText = "";
            feedback.className = "feedback";
            userText.innerHTML = "Venter på din tale...";
            
            recognition.start();
            
            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript.toLowerCase();
                userText.innerHTML = `Du sagde: "${transcript}"`;
                
                const passed = scenario.expected_keywords.some(kw => transcript.includes(kw));
                
                if (passed) {
                    feedback.innerText = "✅ Perfekt! Tjeneren forstod dig.";
                    feedback.classList.add('success');
                } else {
                    feedback.innerText = "❌ Tjeneren fangede det ikke helt. Prøv igen!";
                    feedback.classList.add('error');
                }
            };
            
            recognition.onspeechend = function() {
                recognition.stop();
                resetMicButton(micBtn);
            };
            
            recognition.onerror = function(event) {
                resetMicButton(micBtn);
                feedback.innerText = "Sørg for at du har givet tilladelse til mikrofonen.";
                feedback.classList.add('error');
            };
        }

        function resetMicButton(btn) {
            btn.innerHTML = "🎤 Tryk for at svare";
            btn.classList.remove('listening');
        }
    </script>
</body>
</html>
