<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spansk Scenarie Træner</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-hover: #059669;
            --bg-gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden; /* Låser siden, så der ikke kan scroles */
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            height: 100dvh; /* Tilpasser sig perfekt til mobilskærme uden at skabe scroll */
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2rem 1.5rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header-tag {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.7rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 0.25rem;
            display: block;
        }

        h2 {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 300;
            color: var(--text-muted);
        }

        .npc-dialogue {
            font-size: 1.5rem;
            font-weight: 500;
            margin: 1rem 0 0.5rem 0;
            color: var(--text-main);
            line-height: 1.2;
        }

        button {
            font-family: inherit;
            border: none;
            border-radius: 99px;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-listen {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 10px 20px;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }

        .btn-listen:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            width: 100%;
            margin-top: 1rem;
            font-size: 1rem;
            padding: 14px;
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.2);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-primary.listening {
            background: #ef4444;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.5);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .hint-toggle {
            background: transparent;
            color: var(--text-muted);
            font-size: 0.8rem;
            padding: 4px 12px;
            margin-top: 0.25rem;
        }

        .hint-toggle:hover {
            color: var(--text-main);
        }

        .hint-box {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.75rem 1rem;
            border-radius: 12px;
            margin-top: 0.5rem;
            text-align: left;
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }
        
        .hint-box strong { color: var(--text-main); }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--card-border), transparent);
            margin: 1rem 0;
        }

        #user-text {
            margin-top: 0.75rem;
            min-height: 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-style: italic;
        }

        .feedback {
            margin-top: 0.5rem;
            font-weight: 500;
            font-size: 1rem;
            min-height: 20px;
        }
        
        .success { color: #10b981; }
        .error { color: #ef4444; }

    </style>
</head>
<body>

    <div class="card">
        <div>
            <span class="header-tag">Scenarie 1</span>
            <h2>På Café i Madrid</h2>
        </div>
        
        <div class="divider"></div>

        <div>
            <div class="npc-dialogue" id="npc-text">
                "Hola, ¿qué vas a tomar?"
            </div>
            <button class="btn-listen" onclick="speakNPC()">🔊 Lyt til tjeneren</button>

            <div>
                <button class="hint-toggle" onclick="toggleHint()">💡 Brug for et hint?</button>
                <div id="hint-box" class="hint-box">
                    <p><strong>Gloser:</strong> En kaffe = un café | Vand = agua</p>
                    <p><strong>Forslag:</strong> "Quiero un café, por favor."</p>
                </div>
            </div>
        </div>

        <div class="divider"></div>

        <div>
            <button class="btn-primary" onclick="startListening()" id="mic-btn">🎤 Tryk for at svare</button>
            <p id="user-text">Din tur til at tale...</p>
            <div id="feedback" class="feedback"></div>
        </div>
    </div>

    <script>
        const scenario = {
            npc_text: "Hola, ¿qué vas a tomar?",
            expected_keywords: ["café", "agua", "cerveza", "vino", "té", "tapas"]
        };

        function speakNPC() {
            const utterance = new SpeechSynthesisUtterance(scenario.npc_text);
            utterance.lang = 'es-ES'; 
            utterance.rate = 0.9;     
            window.speechSynthesis.speak(utterance);
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            hintBox.style.display = hintBox.style.display === 'block' ? 'none' : 'block';
        }

        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("Din browser understøtter ikke talegenkendelse. Brug Chrome eller Edge.");
                return;
            }
            
            const recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.interimResults = false;
            
            const micBtn = document.getElementById('mic-btn');
            const userText = document.getElementById('user-text');
            const feedback = document.getElementById('feedback');
            
            micBtn.innerHTML = "🎙️ Lytter...";
            micBtn.classList.add('listening');
            
            feedback.innerText = "";
            feedback.className = "feedback";
            userText.innerHTML = "Venter på din tale...";
            
            recognition.start();
            
            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript.toLowerCase();
                userText.innerHTML = `Du sagde: "${transcript}"`;
                
                const passed = scenario.expected_keywords.some(kw => transcript.includes(kw));
                
                if (passed) {
                    feedback.innerText = "✅ Perfekt! Tjeneren forstod dig.";
                    feedback.classList.add('success');
                } else {
                    feedback.innerText = "❌ Tjeneren fangede det ikke helt. Prøv igen!";
                    feedback.classList.add('error');
                }
            };
            
            recognition.onspeechend = function() {
                recognition.stop();
                resetMicButton(micBtn);
            };
            
            recognition.onerror = function(event) {
                resetMicButton(micBtn);
                feedback.innerText = "Sørg for at du har givet tilladelse til mikrofonen.";
                feedback.classList.add('error');
            };
        }

        function resetMicButton(btn) {
            btn.innerHTML = "🎤 Tryk for at svare";
            btn.classList.remove('listening');
        }
    </script>
</body>
</html>
